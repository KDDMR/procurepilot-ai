[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "procurepilot-ai"
version = "0.1.0"
description = "Policy-aware agentic procurement automation with human approval and Azure-ready deployment"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kadir Demir" }]
keywords = ["agentic-ai", "semantic-kernel", "rag", "fastapi", "azure", "business-automation"]
dependencies = [
  "fastapi>=0.162,<1.0",
  "uvicorn[standard]>=0.38,<1.0",
  "pydantic-settings>=2.12,<3.0",
  "semantic-kernel[azure]>=1.46,<2.0",
  "prometheus-client>=0.23,<1.0",
  "opentelemetry-api>=1.39,<2.0",
  "opentelemetry-sdk>=1.39,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.60b0,<1.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9,<2.0",
  "httpx>=0.28,<1.0",
  "mypy>=1.18,<2.0",
  "pytest>=9.0,<10.0",
  "pytest-asyncio>=1.3,<2.0",
  "pytest-cov>=7.0,<8.0",
  "ruff>=0.14,<1.0",
]

[project.scripts]
procurepilot = "procurepilot.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/procurepilot"]

[tool.pytest.ini_options]
addopts = "-q --cov=procurepilot --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["procurepilot"]

[tool.bandit]
exclude_dirs = ["tests"]

